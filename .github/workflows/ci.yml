name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Lint → Typecheck → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-secret-that-is-at-least-32-chars
          ENCRYPTION_KEY: ci-test-encryption-key-32-chars!!
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
